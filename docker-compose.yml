services:
  n8n:
    image: n8nio/n8n:2.29.7
    container_name: nexus-n8n-workflow-kit
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
    volumes:
      - nexus_n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./samples:/samples:ro

volumes:
  nexus_n8n_data:
